name: Impact

on:
  pull_request:

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Impact report
        run: codeimpact diff origin/${{ github.base_ref }} --merge-base --no-cache --format markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Affected tests
        run: codeimpact diff origin/${{ github.base_ref }} --merge-base --no-cache --run
